[package]
name = "typst-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# rustc now emits bulk-memory, sign-ext and nontrapping-float-to-int by
# default for wasm32-unknown-unknown, but the bundled wasm-opt still validates
# against the MVP feature set unless told otherwise.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-sign-ext",
    "--enable-nontrapping-float-to-int",
    "--enable-mutable-globals",
    "--enable-reference-types",
    "--enable-multivalue",
]

[features]
default = ["pdf"]
# PDF export drags in krilla and hayro (a full PDF interpreter). Turning it off
# is what makes a preview-only build worth measuring against.
pdf = ["dep:typst-pdf"]

[dependencies]
typst = "0.15.1"
typst-svg = "0.15.1"
typst-pdf = { version = "0.15.1", optional = true }
# `PagedDocument` lives here; everything else comes through `typst`'s
# re-exports.
typst-layout = "0.15.1"
comemo = "0.5.1"
serde = { version = "1", features = ["derive"] }
# Without this, `Vec<u8>` crosses into JavaScript as an array of numbers
# rather than a `Uint8Array`, and the exported PDF is unusable.
serde_bytes = "0.11"
typst-ide = "0.15.1"
typstyle-core = "0.15.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[dev-dependencies]
typst-assets = { version = "0.15.1", features = ["fonts"] }
